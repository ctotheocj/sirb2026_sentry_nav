      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: gimbal_yaw_fake
      robot_radius: 0.2
      resolution: 0.05
      width: 23
      height: 24
      track_unknown_space: false
      plugins:
      - static_layer
      - occupancy_grid_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: <robot_namespace>/map
        map_subscribe_transient_local: true
      occupancy_grid_layer:
        plugin: pb_nav2_costmap_2d::OccupancyGridObstacleLayer
        enabled: true
        topic: <robot_namespace>/occupancy_grid
        occupied_threshold: 75
        source_timeout: 0.6
        stamp_source_cell_area: true
        clear_hole_corridors: true
        clear_hole_frame: map
        clear_hole_margin: 0.15
