local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.2
      plugins:
      - static_layer
      - occupancy_grid_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      occupancy_grid_layer:
        plugin: pb_nav2_costmap_2d::OccupancyGridObstacleLayer
        enabled: true
        topic: <robot_namespace>/occupancy_grid
        occupied_threshold: 75
        source_timeout: 0.6
        stamp_source_cell_area: true
        clear_hole_corridors: true
        clear_hole_frame: map
        clear_hole_margin: 0.15
        clear_hole_max_area: 20.0
        debug_logging: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 8.0
        inflation_radius: 0.22
      always_send_full_costmap: true

global_costmap:
