      minco_sample_resolution: 0.18
      minco_waypoint_time_step: 0.55
      minco_min_waypoint_spacing: 0.25
      minco_max_waypoints: 16
      minco_max_pieces: 32
      minco_local_horizon_distance: 6.0
      minco_goal_stop_distance: 0.8
      minco_terminal_pass_speed: 1.5
      minco_guide_fillet_enabled: true
      minco_guide_fillet_radius: 0.35
      minco_guide_fillet_min_angle: 0.25
      minco_use_trapezoidal_time: true
      minco_trapezoidal_k_angle: 0.3
